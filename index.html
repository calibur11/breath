<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숨소리 연동 수면 사운드 v2 (이중 레이어 + 고무줄 페이싱)</title>
  <style>
    :root {
      --bg: #0b101b;
      --card: #131b2e;
      --border: #23304c;
      --text: #e6edf7;
      --muted: #8fa3c4;
      --accent: #5fa8ff;
      --calm: #4fd1c5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .wrap {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 1.3rem; }
    .sub { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #07111f; }
    .btn-stop { background: #e05d6f; color: #fff; }
    .btn-ghost { background: #1c2740; color: var(--text); border: 1px solid var(--border); }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    input[type="range"], select {
      width: 100%;
      accent-color: var(--accent);
      background: #0e1525;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
    }
    canvas {
      width: 100%;
      height: 150px;
      background: #070b13;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: block;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .metric {
      background: #0d1424;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .metric .k { font-size: 0.74rem; color: var(--muted); }
    .metric .v { font-size: 1.05rem; font-weight: 700; margin-top: 4px; color: var(--calm); }
    .note {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      background: #0d1424;
      border-left: 3px solid var(--calm);
      padding: 10px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🌊 숨소리 연동 수면 사운드 v2</h1>
      <p class="sub">
        <strong>이중 레이어</strong>(고정된 바닥 밤공기 + 호흡에 반응하는 파도층)와
        <strong>고무줄 페이싱</strong>(내 호흡 BPM을 감지해 8% 더 느린 파도로 유도)을 테스트합니다.
      </p>
      <div class="note" style="margin-top:12px;">
        <strong>체감 팁:</strong> <code>고무줄 페이싱</code> 모드에서는 내 호흡 주기를 2~3번 감지한 뒤, 파도가 내 호흡보다 살짝 느린 리듬으로 부드럽게 이끌어 줍니다.
      </div>
    </div>

    <div class="card">
      <div class="row">
        <button id="startMicBtn" class="btn-primary">🎙️ 마이크 연동 시작</button>
        <button id="startSimBtn" class="btn-ghost">🌙 마이크 없이 시뮬레이션</button>
        <button id="stopBtn" class="btn-stop" disabled>⏹ 정지</button>
      </div>

      <div class="controls">
        <label>
          마이크 장치 선택
          <select id="micSelect">
            <option value="">기본 마이크 (자동)</option>
          </select>
        </label>
        <label>
          소리 질감 (음색)
          <select id="soundProfile">
            <option value="deep_ocean">깊은 밤바다 (초저음 · 치찰음 제거)</option>
            <option value="warm_drone">따뜻한 저음 화음 (노이즈 없는 패드)</option>
            <option value="soft_rain">부드러운 빗소리 (중저역)</option>
          </select>
        </label>
        <label>
          연동 방식 (모드)
          <select id="modeSelect">
            <option value="elastic">고무줄 페이싱 (내 호흡보다 8% 느리게 유도)</option>
            <option value="mirror">실시간 직결 추종 (내 숨에 1:1 반응)</option>
            <option value="pacer">고정 가이드 (4초 들숨 · 6초 날숨)</option>
          </select>
        </label>
        <label>
          바닥음 볼륨 / 고정층 (<span id="bedVolVal">0.18</span>)
          <input id="bedVol" type="range" min="0.0" max="0.45" step="0.01" value="0.18" />
        </label>
        <label>
          파도층 볼륨 / 가변층 (<span id="waveVolVal">0.30</span>)
          <input id="waveVol" type="range" min="0.05" max="0.65" step="0.01" value="0.30" />
        </label>
        <label>
          호흡 반응 감도 (<span id="sensVal">3.0</span>x)
          <input id="sensitivity" type="range" min="1.0" max="8.0" step="0.2" value="3.0" />
        </label>
        <label>
          변조 폭 / 반응 강도 (<span id="depthVal">45</span>%)
          <input id="modDepth" type="range" min="15" max="100" step="5" value="45" />
        </label>
      </div>
    </div>

    <div class="card">
      <canvas id="scope" width="700" height="150"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#4fd1c5;"></span>감지된 내 호흡</span>
        <span><span class="dot" style="background:#5fa8ff;"></span>출력 파도 리듬</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">상태</div><div class="v" id="statusText">대기 중</div></div>
        <div class="metric"><div class="k">내 호흡 속도</div><div class="v" id="userBpmVal">- 회/분</div></div>
        <div class="metric"><div class="k">유도 파도 속도</div><div class="v" id="guideBpmVal">- 회/분</div></div>
        <div class="metric"><div class="k">현재 파도 필터</div><div class="v" id="filterVal">- Hz</div></div>
      </div>
      <div class="sub" id="micDebug" style="margin-top:10px; font-size:0.8rem;">마이크 입력: 대기 중</div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let micStream = null;
    let rafId = null;
    let simMode = false;
    let running = false;

    // 이중 레이어 오디오 노드
    let bedGain = null;
    let waveGain = null;
    let waveFilter = null;

    let analyser = null;
    let timeData = null;

    let noiseFloor = 0.0005;
    let signalPeak = 0.003;
    let smoothEnvelope = 0;

    // 호흡 주기(BPM) 탐지용 상태
    let wasAbove = false;
    let lastPeakTime = 0;
    let breathIntervals = [];
    let currentUserPeriod = 4.5; // 초기 추정 4.5초 (~13.3 BPM)
    let guidePeriod = 5.0;
    let guidePhase = 0;
    let lastFrameTime = 0;

    const startMicBtn = document.getElementById("startMicBtn");
    const startSimBtn = document.getElementById("startSimBtn");
    const stopBtn = document.getElementById("stopBtn");
    const micSelect = document.getElementById("micSelect");
    const soundProfileSelect = document.getElementById("soundProfile");
    const modeSelect = document.getElementById("modeSelect");
    const bedVolInput = document.getElementById("bedVol");
    const waveVolInput = document.getElementById("waveVol");
    const sensInput = document.getElementById("sensitivity");
    const depthInput = document.getElementById("modDepth");

    const statusText = document.getElementById("statusText");
    const userBpmVal = document.getElementById("userBpmVal");
    const guideBpmVal = document.getElementById("guideBpmVal");
    const filterVal = document.getElementById("filterVal");
    const micDebug = document.getElementById("micDebug");
    const canvas = document.getElementById("scope");
    const ctx2d = canvas.getContext("2d");

    bedVolInput.oninput = () => {
      document.getElementById("bedVolVal").textContent = bedVolInput.value;
      if (bedGain && audioCtx) {
        bedGain.gain.setTargetAtTime(Number(bedVolInput.value), audioCtx.currentTime, 0.05);
      }
    };
    waveVolInput.oninput = () => document.getElementById("waveVolVal").textContent = waveVolInput.value;
    sensInput.oninput = () => document.getElementById("sensVal").textContent = sensInput.value;
    depthInput.oninput = () => document.getElementById("depthVal").textContent = depthInput.value;

    function createBrownNoiseBuffer(ctx, seconds = 8) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * seconds;
      const buffer = ctx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (lastOut + 0.02 * white) / 1.02;
        lastOut = data[i];
        data[i] *= 3.2;
      }
      const fadeLen = Math.floor(sampleRate * 0.2);
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        data[i] = data[i] * w + data[length - fadeLen + i] * (1 - w);
      }
      return buffer;
    }

    function createPinkNoiseBuffer(ctx, seconds = 8) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * seconds;
      const buffer = ctx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.06;
        b6 = white * 0.115926;
      }
      const fadeLen = Math.floor(sampleRate * 0.2);
      for (let i = 0; i < fadeLen; i++) {
        const w = i / fadeLen;
        data[i] = data[i] * w + data[length - fadeLen + i] * (1 - w);
      }
      return buffer;
    }

    function setupSoundEngine() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Layer 1: 고정된 바닥 밤공기 (따뜻한 브라운 노이즈)
      const bedSrc = audioCtx.createBufferSource();
      bedSrc.buffer = createBrownNoiseBuffer(audioCtx, 8);
      bedSrc.loop = true;

      const bedFilter = audioCtx.createBiquadFilter();
      bedFilter.type = "lowpass";
      bedFilter.frequency.value = 240;

      bedGain = audioCtx.createGain();
      bedGain.gain.value = Number(bedVolInput.value);

      bedSrc.connect(bedFilter);
      bedFilter.connect(bedGain);
      bedGain.connect(audioCtx.destination);
      bedSrc.start();

      // Layer 2: 소리 질감에 따른 호흡 반응층
      const profile = soundProfileSelect.value;
      waveFilter = audioCtx.createBiquadFilter();
      waveFilter.type = "lowpass";
      waveFilter.frequency.value = 260;
      waveFilter.Q.value = 0.5;

      waveGain = audioCtx.createGain();
      waveGain.gain.value = Number(waveVolInput.value) * 0.7;

      if (profile === "warm_drone") {
        // 노이즈 없는 따뜻한 저음 5도 화음 (A2 110Hz + E3 164.8Hz)
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = "sine";
        osc2.type = "sine";
        osc1.frequency.value = 110;
        osc2.frequency.value = 164.81;

        const oscMix = audioCtx.createGain();
        oscMix.gain.value = 0.22;

        osc1.connect(oscMix);
        osc2.connect(oscMix);
        oscMix.connect(waveFilter);
        osc1.start();
        osc2.start();
      } else {
        const waveSrc = audioCtx.createBufferSource();
        waveSrc.buffer = profile === "soft_rain"
          ? createPinkNoiseBuffer(audioCtx, 8)
          : createBrownNoiseBuffer(audioCtx, 8);
        waveSrc.loop = true;
        waveSrc.connect(waveFilter);
        waveSrc.start();
      }

      waveFilter.connect(waveGain);
      waveGain.connect(audioCtx.destination);
    }

    async function refreshMicList() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter(d => d.kind === "audioinput");
      const current = micSelect.value;
      micSelect.innerHTML = '<option value="">기본 마이크 (자동)</option>';
      inputs.forEach((d, idx) => {
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || `마이크 ${idx + 1}`;
        micSelect.appendChild(opt);
      });
      if (current) micSelect.value = current;
    }

    async function start(useMic) {
      stop();
      simMode = !useMic;
      setupSoundEngine();
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      if (useMic) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("HTTPS 또는 localhost 환경이 아니어서 브라우저가 마이크 접근을 차단했습니다.");
          }
          const audioConstraints = {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          };
          if (micSelect.value) {
            audioConstraints.deviceId = { exact: micSelect.value };
          }
          micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
          await refreshMicList();
          const track = micStream.getAudioTracks()[0];
          const micName = track ? track.label : "기본 마이크";

          const micSource = audioCtx.createMediaStreamSource(micStream);
          const hp = audioCtx.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 120;

          const lp = audioCtx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 1800;

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          timeData = new Float32Array(analyser.fftSize);

          const silentGain = audioCtx.createGain();
          silentGain.gain.value = 0;

          micSource.connect(hp);
          hp.connect(lp);
          lp.connect(analyser);
          analyser.connect(silentGain);
          silentGain.connect(audioCtx.destination);

          noiseFloor = 0.0005;
          signalPeak = 0.003;
          statusText.textContent = "마이크 감지 중";
          micDebug.textContent = `연결된 마이크: ${micName}`;
        } catch (err) {
          statusText.textContent = "마이크 권한 오류";
          alert("마이크 접근에 실패했습니다: " + err.message);
          stop();
          return;
        }
      } else {
        statusText.textContent = "시뮬레이션 중";
        micDebug.textContent = "가상 호흡 신호(약 13.5회/분)로 고무줄 페이싱 테스트 중";
      }

      wasAbove = false;
      lastPeakTime = 0;
      breathIntervals = [];
      currentUserPeriod = 4.5;
      guidePeriod = 4.9;
      guidePhase = 0;
      lastFrameTime = performance.now();

      running = true;
      startMicBtn.disabled = true;
      startSimBtn.disabled = true;
      stopBtn.disabled = false;
      loop();
    }

    function stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      analyser = null;
      smoothEnvelope = 0;
      startMicBtn.disabled = false;
      startSimBtn.disabled = false;
      stopBtn.disabled = true;
      statusText.textContent = "대기 중";
      userBpmVal.textContent = "- 회/분";
      guideBpmVal.textContent = "- 회/분";
      filterVal.textContent = "- Hz";
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    }

    const userHistory = new Array(175).fill(0);
    const guideHistory = new Array(175).fill(0);

    function updateBreathPeriod(envelope, nowMs) {
      // 히스테리시스 피크 탐지: 0.55 이상 올라갈 때 새 호흡으로 카운트
      if (!wasAbove && envelope > 0.55) {
        wasAbove = true;
        if (lastPeakTime > 0) {
          const intervalSec = (nowMs - lastPeakTime) / 1000;
          if (intervalSec >= 1.8 && intervalSec <= 14.0) {
            breathIntervals.push(intervalSec);
            if (breathIntervals.length > 4) breathIntervals.shift();
            const avg = breathIntervals.reduce((a, b) => a + b, 0) / breathIntervals.length;
            currentUserPeriod = avg;
          }
        }
        lastPeakTime = nowMs;
      } else if (wasAbove && envelope < 0.35) {
        wasAbove = false;
      }
    }

    function loop() {
      if (!running || !audioCtx) return;

      const nowMs = performance.now();
      const dtSec = Math.min(0.1, (nowMs - lastFrameTime) / 1000);
      lastFrameTime = nowMs;

      let targetBreath = 0;
      if (simMode) {
        // 시뮬레이션: 약 4.4초 주기 (13.6 BPM) 가상 호흡
        targetBreath = 0.5 + 0.5 * Math.sin((nowMs / 1000) * ((2 * Math.PI) / 4.4));
      } else if (analyser && timeData) {
        analyser.getFloatTimeDomainData(timeData);
        let sum = 0;
        for (let i = 0; i < timeData.length; i++) sum += timeData[i] * timeData[i];
        const rms = Math.sqrt(sum / timeData.length);

        noiseFloor = noiseFloor * 0.99 + Math.min(rms, noiseFloor * 1.4) * 0.01;
        signalPeak = Math.max(rms, signalPeak * 0.992, noiseFloor + 0.0004);

        const sens = Number(sensInput.value);
        const span = Math.max(signalPeak - noiseFloor, 0.0004);
        const normalized = Math.max(0, (rms - noiseFloor * 1.05) / span);
        targetBreath = Math.min(1, normalized * (sens / 2.5));
        micDebug.textContent = `장치: ${micStream?.getAudioTracks()[0]?.label || '기본'} | RMS: ${rms.toFixed(5)} (바닥 ${noiseFloor.toFixed(5)} ~ 피크 ${signalPeak.toFixed(5)})`;
      }

      const alpha = targetBreath > smoothEnvelope ? 0.16 : 0.055;
      smoothEnvelope = smoothEnvelope * (1 - alpha) + targetBreath * alpha;
      updateBreathPeriod(smoothEnvelope, nowMs);

      const mode = modeSelect.value;
      let outputWave = smoothEnvelope;

      if (mode === "elastic") {
        // 고무줄 페이싱: 내 현재 주기보다 8% 더 느린 목표 주기 (최대 10초 = 6 BPM)
        const targetPeriod = Math.min(10.0, Math.max(3.5, currentUserPeriod * 1.08));
        guidePeriod = guidePeriod * 0.98 + targetPeriod * 0.02;
        guidePhase = (guidePhase + dtSec / guidePeriod) % 1.0;
        // 0.4 들숨 상승, 0.6 날숨 하강 비대칭 파도
        outputWave = guidePhase < 0.4
          ? 0.5 - 0.5 * Math.cos((guidePhase / 0.4) * Math.PI)
          : 0.5 + 0.5 * Math.cos(((guidePhase - 0.4) / 0.6) * Math.PI);
        guideBpmVal.textContent = `${(60 / guidePeriod).toFixed(1)} 회/분`;
      } else if (mode === "pacer") {
        guidePeriod = 10.0;
        const t = (nowMs / 1000) % 10;
        outputWave = t < 4
          ? 0.5 - 0.5 * Math.cos((t / 4) * Math.PI)
          : 0.5 + 0.5 * Math.cos(((t - 4) / 6) * Math.PI);
        guideBpmVal.textContent = "6.0 회/분";
      } else {
        guideBpmVal.textContent = "1:1 추종";
      }

      userBpmVal.textContent = breathIntervals.length > 0
        ? `${(60 / currentUserPeriod).toFixed(1)} 회/분`
        : "측정 중...";

      // 파도층(Layer 2) 볼륨과 필터 변조: 치찰음 없이 좁고 포근한 안전 밴드 유지
      const baseWaveVol = Number(waveVolInput.value);
      const depth = Number(depthInput.value) / 100;
      const profile = soundProfileSelect.value;

      const volMin = baseWaveVol * (1 - 0.35 * depth);
      const volMax = baseWaveVol * (1 + 0.35 * depth);
      const modWaveVol = Math.max(0.01, volMin + (volMax - volMin) * outputWave);

      let cutMin = 130;
      let cutMax = 130 + 270 * depth; // 깊은 밤바다: 130Hz ~ 400Hz (치찰음 없음)
      if (profile === "soft_rain") {
        cutMin = 180;
        cutMax = 180 + 360 * depth; // 부드러운 빗소리: 180Hz ~ 540Hz
      } else if (profile === "warm_drone") {
        cutMin = 160;
        cutMax = 160 + 260 * depth; // 따뜻한 화음: 160Hz ~ 420Hz
      }
      const modCutoff = cutMin + (cutMax - cutMin) * outputWave;

      const now = audioCtx.currentTime;
      waveGain.gain.setTargetAtTime(modWaveVol, now, 0.07);
      waveFilter.frequency.setTargetAtTime(modCutoff, now, 0.07);
      filterVal.textContent = `${Math.round(modCutoff)} Hz`;

      // 그래프 그리기 (내 호흡: 민트색, 출력 파도: 파란색)
      userHistory.push(smoothEnvelope);
      guideHistory.push(outputWave);
      if (userHistory.length > 175) userHistory.shift();
      if (guideHistory.length > 175) guideHistory.shift();

      ctx2d.clearRect(0, 0, canvas.width, canvas.height);

      const drawCurve = (arr, color, width) => {
        ctx2d.beginPath();
        ctx2d.strokeStyle = color;
        ctx2d.lineWidth = width;
        for (let i = 0; i < arr.length; i++) {
          const x = (i / (arr.length - 1)) * canvas.width;
          const y = canvas.height - 16 - arr[i] * (canvas.height - 32);
          if (i === 0) ctx2d.moveTo(x, y);
          else ctx2d.lineTo(x, y);
        }
        ctx2d.stroke();
      };

      drawCurve(userHistory, "#4fd1c5", 2);
      drawCurve(guideHistory, "#5fa8ff", 2.5);

      rafId = requestAnimationFrame(loop);
    }

    startMicBtn.onclick = () => start(true);
    startSimBtn.onclick = () => start(false);
    stopBtn.onclick = stop;
  </script>
</body>
</html>
